<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="A dashboard for exploring the Australian property market." />

  <title>Australian Property Market Explorer</title>

  <script>
    (() => {
      const savedTheme = localStorage.getItem('theme');
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme === 'light' || savedTheme === 'dark'? savedTheme: systemPrefersDark ? 'dark' : 'light';

      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
</head>

<body>
  <div id="root"></div>

  <script src="/australian-property-market-explorer/redirect.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
